[package]
name = "luvia-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["AsahiArt"]
description = "Pinned SSH transport for Luvia host bridge sessions"
publish = false

[lib]
name = "luvia_transport"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
bytes = "1"
data-encoding = "2.6"
getrandom = "0.3"
russh = { version = "0.63.1", default-features = false, features = ["ring", "rsa"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
uniffi = { version = "0.29.4", features = ["tokio"] }
zeroize = { version = "1.8", features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
