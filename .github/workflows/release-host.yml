name: Release luvia-host

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match the host crate version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate="$(python3 <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("host/Cargo.toml").read_text()
          match = re.search(r'(?m)^version = "([^"]+)"', text)
          if not match:
              sys.exit("host/Cargo.toml has no package version")
          print(match.group(1), end="")
          PY
          )"
          tag="${TAG#v}"
          if [ "$tag" != "$crate" ]; then
            printf 'tag %s does not match host crate version %s\n' "$TAG" "$crate" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: make check test-rust

  build:
    name: ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: luvia-host-universal-apple-darwin
            kind: macos-universal
          - os: ubuntu-latest
            asset: luvia-host-x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            kind: linux
          - os: ubuntu-24.04-arm
            asset: luvia-host-aarch64-unknown-linux-gnu
            rust_target: aarch64-unknown-linux-gnu
            kind: linux
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.kind == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS universal binary
        if: matrix.kind == 'macos-universal'
        run: |
          cargo build --release -p luvia-host --target aarch64-apple-darwin
          cargo build --release -p luvia-host --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/luvia-host \
            target/x86_64-apple-darwin/release/luvia-host \
            -output dist/luvia-host
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" luvia-host
      - name: Build Linux binary
        if: matrix.kind == 'linux'
        run: |
          cargo build --release -p luvia-host --target ${{ matrix.rust_target }}
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/luvia-host" dist/luvia-host
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" luvia-host
      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Combined checksums
        run: |
          cat artifacts/*.sha256 | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            SHA256SUMS.txt
          generate_release_notes: true

  bump-homebrew-tap:
    name: bump homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: luvia-host-universal-apple-darwin
          path: dist
      - name: Update Formula/luvia-host.rb in AsahiArt/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is missing or empty" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          ASSET="luvia-host-universal-apple-darwin.tar.gz"
          ASSET_URL="https://github.com/AsahiArt/Luvia/releases/download/${TAG}/${ASSET}"
          SHA256="$(sha256sum "dist/${ASSET}" | awk '{print $1}')"
          EXPECTED="$(awk '{print $1}' "dist/${ASSET}.sha256")"
          if [ "${#SHA256}" -ne 64 ] || [ "${SHA256}" != "${EXPECTED}" ]; then
            echo "checksum mismatch: computed=${SHA256} expected=${EXPECTED}" >&2
            exit 1
          fi

          git clone --depth 1 https://github.com/AsahiArt/homebrew-tap.git tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          VERSION="${VERSION}" URL="${ASSET_URL}" SHA256="${SHA256}" python3 <<'PY'
          import os, pathlib, re

          path = pathlib.Path("Formula/luvia-host.rb")
          text = path.read_text()
          replacements = {
              "version": os.environ["VERSION"],
              "url": os.environ["URL"],
              "sha256": os.environ["SHA256"],
          }

          def replace_field(text, field, value):
              pattern = rf'^(\s*{re.escape(field)}\s+")[^"]*("\s*)$'
              new, n = re.subn(pattern, lambda m: m.group(1) + value + m.group(2), text, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f"failed to replace {field}: {n} matches")
              return new

          for field, value in replacements.items():
              text = replace_field(text, field, value)
          path.write_text(text)
          print(f"updated {path} to version={os.environ['VERSION']} sha256={os.environ['SHA256']}")
          PY

          git add Formula/luvia-host.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${TAG}"
            exit 0
          fi
          git commit -m "luvia-host ${VERSION}"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${BASIC_AUTH}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" push origin HEAD
