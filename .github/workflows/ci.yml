name: CI

# Build and test through the Makefile so local commands and CI stay aligned.
# Device run targets (`make android` / `make ios`) are local-only.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check and test workspace
        run: make check test-rust
      - name: Cross-check iOS transport
        if: runner.os == 'macOS'
        run: make check-transport-ios

  android:
    name: android
    runs-on: ubuntu-latest
    env:
      # Local builds are arm64-v8a only. CI still packages the emulator ABI.
      LUVIA_ANDROID_EMULATOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # Action default still includes `tools`, which Google dropped.
          packages: platform-tools
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          link-to-sdk: true
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v5
      - name: Cross-check Android transport
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: make check-transport-android
      - name: Assemble debug and unit tests
        run: make test-android
      # Runs R8 with proguard-rules.pro. Shrinking breaks reflective
      # kotlinx.serialization and UniFFI/JNA lookups only in release, so the
      # debug assemble above cannot catch it.
      - name: Assemble release (R8)
        run: make android-release

  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v5
      # Per-target compiles can pass while commonMain is broken, because okio
      # and friends only declare some members in platform source sets. The
      # metadata compilation is what catches that, and no other job runs it.
      - name: Compile common metadata and device target
        run: make ios-compile
      - name: Shared tests on all targets
        run: make ios-test
      - name: Link shared framework for the simulator
        run: make ios-framework
      - name: Build iOS app for the simulator
        run: make ios-build

  # Exercises upload-artifact@v7, download-artifact@v8 (merge-multiple),
  # and action-gh-release@v3. Those last two only run on tagged publishes,
  # so this job is the only regular coverage. The draft is deleted before
  # the job ends and is never made latest.
  actions-smoke:
    name: actions-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Stage smoke files
        run: |
          mkdir dist
          echo smoke-a > dist/a.txt
          echo smoke-b > dist/b.txt
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-a
          path: dist/a.txt
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-b
          path: dist/b.txt
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Check merged artifacts
        run: |
          test -f artifacts/a.txt
          test -f artifacts/b.txt
          grep -qx smoke-a artifacts/a.txt
          grep -qx smoke-b artifacts/b.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ci-actions-smoke-${{ github.run_id }}
          name: CI actions smoke ${{ github.run_id }}
          draft: true
          prerelease: true
          make_latest: false
          files: artifacts/a.txt
      - name: Delete smoke release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "ci-actions-smoke-${{ github.run_id }}" --yes --cleanup-tag || true

